<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fabler &amp; Fakta Studio – appar, illustration &amp; animation</title>
  <meta name="description" content="Fabler &amp; Fakta Studio skapar appar, illustration och animation – där berättelser möter kunskap.">
  <meta name="theme-color" content="#1a1630">
  <meta property="og:title" content="Fabler &amp; Fakta Studio">
  <meta property="og:description" content="Appar, illustration &amp; animation – där berättelser möter kunskap.">
  <meta property="og:image" content="https://fablerfakta.github.io/assets/img/og.jpg">
  <meta property="og:url" content="https://fablerfakta.github.io/">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preload" as="image" href="assets/img/hero-mobil-720.jpg" media="(max-aspect-ratio: 3/4)">
  <link rel="preload" as="image" href="assets/img/hero-1920.jpg?v=3" media="(min-aspect-ratio: 3/4)">
  <link rel="stylesheet" href="assets/style.css?v=17">
</head>
<body>

  <header id="top" class="hero">
    <picture>
      <source media="(max-aspect-ratio: 3/4)" srcset="assets/img/hero-mobil-720.jpg 720w, assets/img/hero-mobil-1080.jpg 1080w" sizes="100vw">
      <img src="assets/img/hero-1920.jpg?v=3" srcset="assets/img/hero-1280.jpg?v=3 1280w, assets/img/hero-1920.jpg?v=3 1920w" sizes="100vw"
           alt="Fabler &amp; Fakta Studio – en uppslagen bok, en fjäderpenna och en glödlampa under en stjärnhimmel">
    </picture>
    <div class="stage" aria-hidden="true">
      <div class="layer-bg">
        <img class="sky" src="assets/img/mobil-sky.jpg" alt="">
        <canvas class="layer-earth"></canvas>
      </div>
      <div class="float"><div class="tilt">
        <picture>
          <source type="image/webp" srcset="assets/img/mobil-logo-back.webp?v=3">
          <img class="layer-logo" src="assets/img/mobil-logo-back.png?v=3" alt="">
        </picture>
        <picture>
          <source type="image/webp" srcset="assets/img/mobil-logo-front.webp?v=2">
          <img class="layer-front" src="assets/img/mobil-logo-front.png?v=2" alt="">
        </picture>
        <div class="sparkles"></div>
      </div>
        <picture>
          <source type="image/webp" srcset="assets/img/mobil-text.webp?v=1">
          <img class="layer-text" src="assets/img/mobil-text.png?v=1" alt="">
        </picture>
      </div>
    </div>
    <nav class="bottomnav" aria-label="Meny">
      <a href="#">Appar</a>
      <a href="#">Illustration</a>
      <a href="#">Om</a>
      <a href="#">Kontakt</a>
    </nav>
  </header>

  <script src="assets/tilt.js?v=8" defer></script>
  <script src="assets/earth.js?v=3" defer></script>
  <script src="assets/sparkle.js?v=11" defer></script>
</body>
</html>
